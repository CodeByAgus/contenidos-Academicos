<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 en 10</title>
</head>
<body bgcolor="lightgreen">
    <!--Imprimir en pantalla los números del 10 al 100  con rangos de 10 en 10 -->

    <script language="javascript">
      for (f = 10; f <= 100; f += 10) {
        document.write(f + " ");
      }
    </script>



</body>
</html>
