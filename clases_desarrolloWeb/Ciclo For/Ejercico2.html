<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
</head>
<body bgcolor="lightblue">
    <!-- Imprimir en pantalla los números del 1 al 10 utilizando la sentencia FOR. 
     el fondo de la pantalla debe tener un 
    color y los números pares un color distinto de los impares. -->

    <script language="javascript">
      for (f = 1; f <= 10; f++) {
        if (f % 2 === 0) {
          document.write("<font color='green'>" + f + "</font> ");
        } else {
          document.write("<font color='red'>" + f + "</font> ");
        }
      }
    </script>



</body>
</html>
