<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Ciclo While</title>
</head>
<body>
    <!--
    Ejercicio 1
    Ingresar 10 valores enteros por teclado. Calcular e informar:
    a) La cantidad de valores negativos ingresados
    b) La cantidad de valores positivos ingresados
    c) La cantidad de múltiplos de 15
    d) El valor acumulado de los números ingresados que son pares
    -->
<script language="javascript">
      let cantneg = 0;
      let cantplus = 0;
      let mult15 = 0;
      let sum = 0;
      let count = 0;

      while (count < 10) {
        let value = parseInt(prompt("Ingrese Valores"));

        if (value < 0) {
          cantneg++;
        } else if (value > 0) {
          cantplus++;
        }

        if (value % 15 === 0) {
          mult15++;
        }

        if (value % 2 === 0) {
          sum += value;
        }

        count++;
      }

      document.write("<h2>Resultados</h2>");
      document.write("<p>Cantidad de valores negativos: " + cantneg + "</p>");
      document.write("<p>Cantidad de valores positivos: " + cantplus + "</p>");
      document.write("<p>Cantidad de múltiplos de 15: " + mult15 + "</p>");
      document.write("<p>Suma de valores pares: " + sum + "</p>");
</script>

</body>
</html>
